name: Reusable Node.js build

on:
  workflow_call:
    inputs:
      node_version:
        required: true
        type: string
        description: "The version of node.js to use"

jobs:
  runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.job
      uses: actions/setup-node@v4
      with:
        node-version: $ {{ inputs.node_version}}

    - name: Install Dependencies
      run: npm ci 

    - name: Run tests
      run: npm test
